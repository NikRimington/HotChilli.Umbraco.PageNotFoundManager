name: Build and Release Package

# Triggers on v18 release tags (v18.x.x) and beta tags (v18.x.x-betaN)

on:
  push:
    tags:
      - "v18.[0-9]+.[0-9]+"
      - "v18.[0-9]+.[0-9]+-beta*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Only release tags can deploy to this environment, and the nuget.org trusted
    # publishing policy is restricted to it.
    environment: nuget

    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived NuGet API key

    steps:

    - name: Set Version Variable
      if: ${{ github.ref_type == 'tag' }}
      env:
        TAG: ${{ github.ref_name }}
      shell: bash
      run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build frontend
      working-directory: src/hc.pagenotfoundmanager.client
      run: |
        npm install
        npm run build

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build project
      run: dotnet build src\HC.PageNotFoundManager\HC.PageNotFoundManager.csproj --configuration Release /p:Version=${{ env.VERSION }}

    - name: Pack project
      run: dotnet pack src\HC.PageNotFoundManager\HC.PageNotFoundManager.csproj --no-build --output nupkgs /p:PackageVersion=${{ env.VERSION }}

    # The key lasts an hour, so request it right before pushing.
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USER}}

    - name: Push to NuGet
      run: dotnet nuget push **\*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
