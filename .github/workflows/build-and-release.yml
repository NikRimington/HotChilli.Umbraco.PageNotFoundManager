name: Build and Release Package

# Triggers when a version tag is pushed (e.g. v1.2.3)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/hc.pagenotfoundmanager.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/hc.pagenotfoundmanager.client
        run: npm ci

      - name: Build frontend
        working-directory: src/hc.pagenotfoundmanager.client
        run: npm run build

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build project
        run: dotnet build src\HC.PageNotFoundManager\HC.PageNotFoundManager.csproj --configuration Release /p:Version=${{ env.VERSION }}

      - name: Pack project
        run: dotnet pack src\PageNotFoundManager.sln --no-build --output nupkgs /p:PackageVersion=${{ env.VERSION }}

      - name: Publish to NuGet
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push **\*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
